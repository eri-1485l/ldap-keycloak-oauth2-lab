services:
  openldap:
    build: ./ldap
    image: openldap-protected:latest
    container_name: openldap
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      LDAP_ORGANISATION: "Example Corp"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "adminpassword"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks: [auth-network]

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8080:80"
    depends_on: [openldap]
    networks: [auth-network]

  postgres:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpassword
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    networks: [auth-network]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: adminpassword
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpassword
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_LOG: "console,file"
      KC_LOG_FILE: /opt/keycloak/data/log/keycloak.log
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - keycloak_logs:/opt/keycloak/data/log
    depends_on: [postgres, openldap]
    networks: [auth-network]

  keycloak-fail2ban:
    build: ./keycloak-fail2ban
    container_name: keycloak-fail2ban
    network_mode: "service:keycloak"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - keycloak_logs:/var/log/keycloak
    depends_on:
      - keycloak

volumes:
  ldap_data:
  ldap_config:
  keycloak_db:
  keycloak_logs:

networks:
  auth-network:
